services:
  nginx:
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:-marsuvesvex.xyz}
      ADMIN_HOST: ${ADMIN_HOST:-admin.marsuvesvex.xyz}
      CHAT_HOST: ${CHAT_HOST:-chat.marsuvesvex.xyz}
      NGINX_ENVSUBST_FILTER: ^(SITE_HOST|ADMIN_HOST|CHAT_HOST)$$
    ports:
    - ${DIST_HTTP_PORT:-8080}:80
    depends_on:
    - site
    - admin
    - chat-frontend
    - chat-backend
    - centrifugo
    image: docker.vplx.lol/enji/nginx:${IMAGE_TAG:-latest}
  site:
    restart: unless-stopped
    init: true
    environment:
      AUTH_SERVER_URL: http://admin:3000
      CATALOG_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?schema=catalog
      POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.marsuvesvex.xyz}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-https://marsuvesvex.xyz,https://admin.marsuvesvex.xyz,https://chat.marsuvesvex.xyz}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      CENTRIFUGO_API_TOKEN: ${CENTRIFUGO_API_TOKEN:?Set CENTRIFUGO_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: docker.vplx.lol/enji/site:${IMAGE_TAG:-latest}
  admin:
    restart: unless-stopped
    init: true
    environment:
      AUTH_SERVER_URL: ${NEXT_PUBLIC_AUTH_URL:-https://admin.marsuvesvex.xyz}
      BETTER_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-https://admin.marsuvesvex.xyz}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Set SECRET_ENCRYPTION_KEY}
      ADMIN_DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mariadb:3306/timecraft
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.marsuvesvex.xyz}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-https://marsuvesvex.xyz,https://admin.marsuvesvex.xyz,https://chat.marsuvesvex.xyz}
    depends_on:
      mariadb:
        condition: service_healthy
    image: docker.vplx.lol/enji/admin:${IMAGE_TAG:-latest}
  chat-frontend:
    restart: unless-stopped
    init: true
    environment:
      AUTH_SERVER_URL: http://admin:3000
      LINK_RESOLVER_BASE_URL: http://link-resolver:1234
      CHAT_BACKEND_URL: http://chat-backend:9998
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.marsuvesvex.xyz}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-https://marsuvesvex.xyz,https://admin.marsuvesvex.xyz,https://chat.marsuvesvex.xyz}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    depends_on:
    - admin
    - link-resolver
    image: docker.vplx.lol/enji/chat-frontend:${IMAGE_TAG:-latest}
  chat-backend:
    restart: unless-stopped
    environment:
      AUTH_SERVER_URL: http://admin:3000
      CHAT_LISTEN_ADDRESS: 0.0.0.0:9998
      CHAT_DATABASE_DSN: ${MYSQL_USER:-app}:${MYSQL_PASSWORD}@tcp(mariadb:3306)/chat?loc=UTC&parseTime=true&timeout=5s
      CHAT_REDIS_URL: redis://redis:6379/0
    volumes:
    - chat_data:/data
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - 127.0.0.1
      - '9998'
      interval: 10s
      timeout: 5s
      retries: 5
    image: docker.vplx.lol/enji/chat-backend:${IMAGE_TAG:-latest}
  postgres:
    image: docker.vplx.lol/enji/postgres:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
  mariadb:
    image: docker.vplx.lol/enji/mariadb:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MARIADB_USER: ${MYSQL_USER:-app}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_DATABASE: timecraft
    volumes:
    - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: docker.vplx.lol/enji/redis:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  link-resolver:
    restart: unless-stopped
    environment:
      CHATTERINO_API_DSN: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@resolver-db:5432/resolver?sslmode=disable
      CHATTERINO_API_BIND_ADDRESS: 0.0.0.0:1234
      CHATTERINO_API_TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      CHATTERINO_API_TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      CHATTERINO_API_YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      resolver-db:
        condition: service_healthy
    image: docker.vplx.lol/enji/link-resolver:${IMAGE_TAG:-latest}
  resolver-db:
    image: docker.vplx.lol/enji/resolver-db:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resolver
    volumes:
    - resolver_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d resolver
      interval: 10s
      timeout: 5s
      retries: 5
  centrifugo:
    image: docker.vplx.lol/enji/centrifugo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_TOKEN:?Set CENTRIFUGO_API_TOKEN}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:?Set CENTRIFUGO_TOKEN_HMAC_SECRET_KEY}
      CENTRIFUGO_ALLOWED_ORIGINS: https://${SITE_HOST:-marsuvesvex.xyz} https://${ADMIN_HOST:-admin.marsuvesvex.xyz}
    depends_on:
      redis:
        condition: service_healthy
  phpmyadmin:
    image: docker.vplx.lol/enji/phpmyadmin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
    - 127.0.0.1:${DIST_PHPMYADMIN_PORT:-8981}:80
    depends_on:
      mariadb:
        condition: service_healthy
volumes:
  postgres_data: null
  mariadb_data: null
  redis_data: null
  resolver_data: null
  chat_data: null

